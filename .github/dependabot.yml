version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    # Chessground (@lichess-org/chessground) sort ~1 release/mois :
    # les mineurs passent via ^10, les majeures demandent une revue manuelle.
    labels:
      - "dependencies"
      - "web"
