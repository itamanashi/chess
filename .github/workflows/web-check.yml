# Gate web : typecheck réel (tsconfig.app.json, pas le solution-style vide),
# lint et suite vitest. Déclenché sur les PR touchant web/** (dont Dependabot).
name: web-check

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-check.yml"
  push:
    branches:
      - main
    paths:
      - "web/**"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -p tsconfig.app.json --noEmit
      - run: npx oxlint
      - run: npm run test -- --run
